# Profiles:
#   (none)              docker compose up                        -> postgres only
#   cache               docker compose --profile cache up        -> + redis
#   observ|observability  docker compose --profile observ up     -> + glitchtip + grafana lgtm
x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://postgres:postgres@glitchtip-postgres:5432/glitchtip
  REDIS_URL: redis://glitchtip-redis:6379/0
  SECRET_KEY: dev-only-glitchtip-secret-key-change-me
  EMAIL_URL: consolemail://
  GLITCHTIP_DOMAIN: http://localhost:8080
  DEFAULT_FROM_EMAIL: glitchtip@localhost
  CELERY_WORKER_AUTOSCALE: "1,3"
  ENABLE_USER_REGISTRATION: "true"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 images mount the volume at /var/lib/postgresql (not .../data)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    profiles: ["cache"]
    ports:
      # 6379/6380 are taken by other local projects
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- observability -------------------------------------------------------

  # Loki (logs) + Grafana + Tempo (traces) + Mimir (metrics) + OTLP collector
  # in one dev image. Point the API's OTLP exporter at localhost:4317 (gRPC)
  # or localhost:4319 (HTTP; host 4318 is taken by another local project).
  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observ", "observability"]
    ports:
      - "3030:3000" # grafana ui (host 3000 is the api)
      - "4317:4317" # otlp grpc
      - "4319:4318" # otlp http
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - lgtm-data:/data

  # GlitchTip (error tracking) — ui at http://localhost:8080, register a user
  # there and create a project to get the DSN for the api's ErrorSink.
  glitchtip-postgres:
    image: postgres:18-alpine
    profiles: ["observ", "observability"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glitchtip"]
      interval: 5s
      timeout: 3s
      retries: 10

  glitchtip-redis:
    image: redis:8-alpine
    profiles: ["observ", "observability"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  glitchtip-migrate:
    image: glitchtip/glitchtip
    profiles: ["observ", "observability"]
    command: ./manage.py migrate
    environment: *glitchtip-env
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy

  glitchtip-web:
    image: glitchtip/glitchtip
    profiles: ["observ", "observability"]
    ports:
      - "8080:8000"
    environment: *glitchtip-env
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully

  glitchtip-worker:
    image: glitchtip/glitchtip
    profiles: ["observ", "observability"]
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-env
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  lgtm-data:
  glitchtip-pg-data:
